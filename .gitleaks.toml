# Gitleaks configuration for GrovBase.
#
# Extends the bundled default ruleset rather than replacing it — a hand-rolled
# rule list goes stale the moment a provider changes its key format.
[extend]
useDefault = true

# Known findings are NOT suppressed here. They are pinned by fingerprint in
# .gitleaks-baseline.json and passed via --baseline-path, so gitleaks reports
# only findings that are new relative to that file.
#
# The difference matters. A path- or regex-based allowlist would blind the
# scanner to the whole file forever, including a real key added tomorrow. A
# baseline suppresses exactly the six vetted findings and nothing else.
#
# See docs/tooling/gitleaks.md for what those six are and why each is benign.

# Scoped with matchCondition = "AND": a finding is suppressed only when it is
# BOTH in .env.example AND matches a placeholder pattern.
#
# The regex list alone would apply to the ENTIRE history — any file, any
# commit, forever — which is wider than the description implies and wider than
# intended. A real credential that happened to contain "your-...-key" anywhere
# in the repo would have been silently dropped.
[allowlist]
description = "Placeholders in the tracked .env.example — never real values."
matchCondition = "AND"
paths = ['''^\.env\.example$''']
regexes = [
  '''your-[a-z-]+-key''',
  '''your-project-ref''',
]
