name: Gitleaks

# Secret scanning over the full history, not just the diff. GrovBase is a
# PUBLIC repository, so anything that ever landed in a commit is world-readable
# and "we deleted the file" is not a remediation.
#
# WHY THE BINARY AND NOT gitleaks/gitleaks-action:
# this repository is owned by an organization (EcomStudio-PL), and the Action
# wrapper requires a GITLEAKS_LICENSE for org-owned repos. The gitleaks CLI
# itself is MIT-licensed and has no such requirement, so we run the release
# binary directly — same scanner, same rules, no licence key to store, and a
# pinned version+checksum instead of a floating tag.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, verified locally 2026-09-19.
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      # Version per the 2026-09-19 GrovBase implementation guide. It could not
      # be verified from the build sandbox (GitHub API is scoped to this repo
      # only), so if the first run reports an unresolvable action, drop to @v4.
      - uses: actions/checkout@v6
        with:
          # Full history. A shallow clone cannot find a key that was committed
          # and then removed, which is the case that actually matters.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSLf -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan history
        run: |
          set -euo pipefail
          # --redact: a finding must never put the secret itself into the CI log,
          #   which is readable by anyone who can read this public repo.
          # --baseline-path: report only what is NEW relative to the six vetted
          #   false positives. See docs/tooling/gitleaks.md.
          ./gitleaks git \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
